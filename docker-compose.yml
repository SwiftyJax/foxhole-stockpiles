services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: fs:latest
    container_name: fs
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Memory optimization - Use jemalloc (set to empty to disable)
      - LD_PRELOAD=${LD_PRELOAD:-/usr/lib/x86_64-linux-gnu/libjemalloc.so.2}
    volumes:
      # User configuration file
      - ${FS_CONFIG_FILE:-./.fs_config}:/home/appuser/.fs_config:ro
      # Template database directory (required)
      - ${FS_DATA_DIR:-./data}:/app/data:ro
      # Screenshots directory
      - ${FS_SCREENSHOTS_DIR:-./screenshots}:/app/screenshots
      # Logs directory
      - ${FS_LOGS_DIR:-./logs}:/app/logs
      # Optional: Custom tessdata models
      - ${FS_TESSDATA_DIR:-./tessdata}:/app/tessdata:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
