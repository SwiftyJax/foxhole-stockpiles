services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: foxhole-stockpiles:latest
    container_name: foxhole-stockpiles-api
    ports:
      - "8000:8000"
    environment:
      # Server configuration (required for Docker)
      - FS_API_SERVER__HOST=0.0.0.0
      - FS_API_SERVER__PORT=8000

      # Database path - REQUIRED
      - FS_SCANNER__DATABASE_PATH=${FS_DATABASE_PATH:-/data/foxhole_templates.pkl}
    volumes:
      # Mount your template database - REQUIRED: Ensure the database file exists
      # Default mounts ./data directory, change if your database is elsewhere
      - ${FS_DATA_DIR:-./data}:/data:ro
      # Optional: Mount tessdata for custom models
      - ./tessdata:/app/tessdata:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Example: API with authentication enabled
  api-secure:
    build:
      context: .
      dockerfile: Dockerfile
    image: foxhole-stockpiles:latest
    container_name: foxhole-stockpiles-api-secure
    ports:
      - "8001:8000"
    environment:
      - FS_API_SERVER__HOST=0.0.0.0
      - FS_API_SERVER__PORT=8000
      - FS_API_SERVER__WORKERS=2

      # Authentication enabled
      - FS_API_AUTH__AUTH_TYPE=bearer
      - FS_API_AUTH__AUTH_TOKEN=${API_TOKEN:-change-me-in-production}

      # Restricted CORS
      - FS_API_SERVER__CORS_ALLOW_ORIGINS=["https://yourdomain.com"]

      - FS_SCANNER__DATABASE_PATH=/data/foxhole_templates.pkl
    volumes:
      - ./data:/data:ro
      - ./tessdata:/app/tessdata:ro
    restart: unless-stopped
    profiles:
      - secure
