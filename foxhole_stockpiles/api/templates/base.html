<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Foxhole Stockpile Scanner{% endblock %}</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent-green: #238636;
            --accent-green-hover: #2ea043;
            --accent-blue: #58a6ff;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-blue) 100%);
            border-radius: 6px;
        }

        .version-badge {
            font-size: 12px;
            padding: 2px 8px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Cards */
        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .card-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .card-body {
            padding: 16px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: white;
            border-color: var(--accent-green);
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--accent-green-hover);
        }

        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: var(--border-color);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Form elements */
        .file-input-wrapper {
            position: relative;
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            padding: 32px;
            text-align: center;
            transition: all 0.2s ease;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .file-input-wrapper:hover {
            border-color: var(--accent-blue);
            background-color: rgba(88, 166, 255, 0.05);
        }

        .file-input-wrapper.dragover {
            border-color: var(--accent-green);
            background-color: rgba(35, 134, 54, 0.1);
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-input-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.6;
        }

        .file-input-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .file-input-text strong {
            color: var(--accent-blue);
        }

        /* Preview */
        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .preview-item {
            position: relative;
            width: 120px;
            height: 90px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Tables */
        .table-wrapper {
            overflow-x: auto;
        }

        .stockpile-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .stockpile-table th,
        .stockpile-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .stockpile-table th {
            background-color: var(--bg-tertiary);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stockpile-table tbody tr:hover {
            background-color: var(--bg-tertiary);
        }

        .icon-cell {
            width: 56px;
            padding: 8px 12px;
        }

        .icon {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            image-rendering: pixelated;
            background-color: var(--bg-tertiary);
        }

        .icon-placeholder {
            width: 40px;
            height: 40px;
            background-color: var(--bg-tertiary);
            border-radius: 4px;
            display: inline-block;
        }

        .quantity-cell {
            width: 100px;
            text-align: right;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', SFMono-Regular, ui-monospace, monospace;
        }

        .crated-badge {
            display: inline-block;
            padding: 2px 6px;
            background-color: rgba(210, 153, 34, 0.2);
            color: var(--accent-orange);
            font-size: 11px;
            font-weight: 500;
            border-radius: 4px;
            margin-left: 8px;
        }

        /* Stockpile sections */
        .stockpile-section {
            margin-bottom: 24px;
        }

        .stockpile-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .stockpile-type {
            display: inline-flex;
            padding: 4px 10px;
            background-color: var(--accent-purple);
            color: white;
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stockpile-type.combined {
            background-color: var(--accent-blue);
        }

        .stockpile-name {
            font-size: 16px;
            font-weight: 600;
        }

        /* Summary stats */
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
        }

        .summary-item {
            background-color: var(--bg-tertiary);
            padding: 16px;
            border-radius: 6px;
            text-align: center;
        }

        .summary-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-blue);
            font-variant-numeric: tabular-nums;
        }

        .summary-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* Alerts */
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .alert-icon {
            flex-shrink: 0;
            font-size: 16px;
        }

        .alert-error {
            background-color: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.4);
            color: var(--accent-red);
        }

        .alert-warning {
            background-color: rgba(210, 153, 34, 0.1);
            border: 1px solid rgba(210, 153, 34, 0.4);
            color: var(--accent-orange);
        }

        .alert-info {
            background-color: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.4);
            color: var(--accent-blue);
        }

        .alert-success {
            background-color: rgba(35, 134, 54, 0.1);
            border: 1px solid rgba(35, 134, 54, 0.4);
            color: var(--accent-green);
        }

        /* Config info */
        .config-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 8px 12px;
            background-color: var(--bg-tertiary);
            border-radius: 4px;
        }

        .config-info code {
            background-color: var(--bg-primary);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'SF Mono', SFMono-Regular, ui-monospace, monospace;
            color: var(--accent-orange);
        }

        /* Loading */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            margin-top: 48px;
            padding: 24px 0;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>
                <div class="header-logo"></div>
                Foxhole Stockpile Scanner
            </h1>
            <span class="version-badge">v{{ version }}</span>
        </header>

        {% block content %}{% endblock %}

        <footer class="footer">
            Foxhole Stockpile Scanner &middot; Open Source
        </footer>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
