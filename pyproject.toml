[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foxhole-stockpiles"
version = "0.1.0"
description = "REST API for processing Foxhole game screenshots to extract stockpile information"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jorge García", email = "jgroca@gmail.com"},
]
maintainers = [
    {name = "Jorge García", email = "jgroca@gmail.com"},
]
keywords = ["foxhole", "gaming", "ocr", "image-processing", "fastapi"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.12"
dependencies = [
    # Core image processing libraries
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "opencv-python-headless>=4.12.0",
    "pydantic>=2.11.9",
    "pydantic_settings>=2.10.1",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
api = [
    # FastAPI and web server
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",

    # Code Quality & Formatting (dev-only)
    "mypy>=1.6.0",
    "ruff>=0.3.4",
    "pre-commit>=3.5.0",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/xurxogr/foxhole-stockpiles"
Repository = "https://github.com/xurxogr/foxhole-stockpiles"

[tool.setuptools.packages.find]
include = ["foxhole_stockpiles*"]

# Remove package-dir since we're using flat layout
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pytesseract.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
stubPath = "stubs"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle (docstring checks)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[project.scripts]
fs = "foxhole_stockpiles.commands.fs.fs:main"
